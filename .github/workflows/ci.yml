name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that's already superseded doesn't need to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies on purpose — these run in about a second.
      - run: node scripts/checks.mjs

  smoke:
    name: Boots in a browser
    runs-on: ubuntu-latest
    # Playwright's own image ships the browser and its system libraries.
    # Installing them on a bare runner means `apt-get` under sudo, which
    # hangs often enough to be useless as a deploy gate.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm init -y && npm i --no-save playwright@1.62.1
      - run: node scripts/smoke.mjs

  deploy:
    name: Deploy to Pages
    # The whole point: a broken push never reaches anyone's phone.
    needs: [checks, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deploy midway — a half-published site is worse than a
    # slightly stale one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publishes the repo as-is, matching what legacy Pages served, so no
      # URL anyone has bookmarked or printed on a QR poster changes.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
