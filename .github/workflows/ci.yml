name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that's already superseded doesn't need to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies on purpose — these run in about a second.
      - run: node scripts/checks.mjs

  smoke:
    name: Boots in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y && npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
